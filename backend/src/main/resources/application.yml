spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meteoaktiv}
    username: ${DB_USER:meteoaktiv}
    password: ${DB_PASSWORD:meteoaktiv}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

meteoaktiv:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  openmeteo:
    base-url: https://api.open-meteo.com/v1/forecast
    models: ecmwf_ifs025,icon_seamless,gfs_seamless
    forecast-days: 3
    timezone: Europe/Zagreb
  fetch:
    interval-ms: 10800000

logging:
  level:
    com.meteoaktiv: INFO
