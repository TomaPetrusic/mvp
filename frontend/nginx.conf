resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name _;

    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
