services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meteoaktiv
      POSTGRES_USER: meteoaktiv
      POSTGRES_PASSWORD: meteoaktiv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteoaktiv"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: meteoaktiv
      DB_USER: meteoaktiv
      DB_PASSWORD: meteoaktiv
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
